version: 2

models:
  - name: stg_employees
    description: Employee staging model

    columns:
      - name: EMP_ID
        tests:
          - unique
          - not_null

      - name: EMP_NAME
        tests:
          - not_null

      - name: DEPARTMENT
        tests:
          - not_null

      - name: SALARY
        tests:
          - not_null

  - name: employee_summary
    description: Department-wise employee summary

    columns:
      - name: DEPARTMENT
        tests:
          - unique